<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDENTIFICATION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@500;700&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #16233F;
    --navy-2: #1F345C;
    --brass: #B98A34;
    --brass-light: #E4C688;
    --paper: #EDEAE1;
    --card: #FFFFFF;
    --ink: #22262B;
    --ink-soft: #5B6472;
    --line: #DCD7C9;
    --danger: #A6402F;
    --ok: #3E7A52;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans Bengali','Noto Sans',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    overflow:hidden;
  }

  /* ---------- Header ---------- */
  header{
    background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;
    padding:28px 22px 22px;
    position:relative;
  }
  header::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:-1px;
    height:14px;
    background:var(--paper);
    border-radius:18px 18px 0 0;
  }
  .brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  .brand-mark{
    width:38px;height:38px;
    border:1.5px solid var(--brass-light);
    border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{width:20px;height:20px;}
  .brand h1{
    font-family:'Noto Serif Bengali',serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:.4px;
    margin:0;
    line-height:1.3;
  }
  .brand p{
    margin:2px 0 0;
    font-size:12.5px;
    color:#B9C2D6;
  }
  .icon-btn{
    width:36px;height:36px;
    border-radius:9px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn svg{width:16px;height:16px;stroke:#fff;}
  .icon-btn.active{background:var(--brass);border-color:var(--brass);}
  .back-row{
    display:flex;align-items:center;gap:10px;
    margin-bottom:14px;
  }
  .detail-title h2{
    font-family:'Noto Serif Bengali',serif;
    font-size:17px;margin:0;font-weight:700;
  }
  .detail-title p{margin:1px 0 0;font-size:12px;color:#B9C2D6;}

  /* ---------- Home / menu ---------- */
  main{padding:20px 18px 90px;}
  .section-label{
    font-size:13px;
    color:var(--ink-soft);
    margin:4px 2px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .menu{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .menu-item{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 14px;
    display:flex;
    align-items:center;
    gap:14px;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
  }
  .menu-item:active{transform:scale(.98);}
  .menu-item:hover{border-color:var(--brass);}
  .menu-icon{
    width:46px;height:46px;
    border-radius:10px;
    background:var(--navy);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .menu-icon svg{width:24px;height:24px;stroke:var(--brass-light);}
  .menu-body{flex:1;min-width:0;}
  .menu-body h3{
    margin:0 0 3px;
    font-size:15px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .menu-body p{
    margin:0;
    font-size:11.5px;
  }
  .status-pill{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    padding:2px 0;
  }
  .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .dot.full{background:var(--ok);}
  .dot.partial{background:var(--brass);}
  .dot.empty{background:#C7C1B3;}
  .chevron{width:16px;height:16px;stroke:var(--ink-soft);flex-shrink:0;}
  .menu-edit-actions{display:flex;gap:6px;flex-shrink:0;}
  .mini-btn{
    width:32px;height:32px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#F7F5EF;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .mini-btn svg{width:15px;height:15px;stroke:var(--ink-soft);}
  .mini-btn.danger{background:#FBEEEC;border-color:#EAD1CC;}
  .mini-btn.danger svg{stroke:var(--danger);}

  .add-menu-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:14px;
    border-radius:14px;
    border:1.5px dashed var(--brass);
    color:var(--navy);
    font-size:13.5px;
    font-weight:600;
    background:transparent;
    cursor:pointer;
  }
  .add-menu-btn svg{width:17px;height:17px;stroke:var(--brass);}
  .menu-count{font-size:11px;color:var(--ink-soft);font-weight:400;}

  /* ---------- Detail view ---------- */
  .side-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }
  .side-card h4{
    margin:0 0 3px;
    font-size:14px;
    font-weight:600;
  }
  .side-card .hint{
    margin:0 0 12px;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .drop{
    border:1.5px dashed var(--line);
    border-radius:12px;
    background:#F7F5EF;
    min-height:150px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    overflow:hidden;
    position:relative;
  }
  .drop.has-photo{
    min-height:0;
    display:block;
  }
  .drop img{
    width:100%;
    height:auto;
    display:block;
  }
  .drop-empty svg{width:26px;height:26px;stroke:var(--ink-soft);}
  .drop-empty span{font-size:12.5px;color:var(--ink-soft);}
  .img-actions{
    position:absolute;
    top:8px;right:8px;
    display:flex;gap:6px;
    z-index:2;
  }
  .img-actions button{
    width:30px;height:30px;
    border-radius:8px;
    border:none;
    background:rgba(22,35,63,.82);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .img-actions button svg{width:15px;height:15px;stroke:#fff;}
  .img-actions button.danger{background:rgba(166,64,47,.9);}

  #toast{
    position:fixed;
    left:50%;bottom:26px;
    transform:translateX(-50%) translateY(20px);
    background:var(--navy);
    color:#fff;
    padding:10px 18px;
    border-radius:10px;
    font-size:12.5px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    max-width:80%;
    text-align:center;
    z-index:80;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .loading-row{
    display:flex;align-items:center;justify-content:center;
    gap:8px;padding:30px 0;color:var(--ink-soft);font-size:12.5px;
  }
  .spinner{
    width:14px;height:14px;
    border:2px solid var(--line);
    border-top-color:var(--brass);
    border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(22,35,63,.55);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
  }
  .modal-card{
    width:100%;
    max-width:430px;
    background:var(--card);
    border-radius:18px 18px 0 0;
    padding:22px 20px 26px;
  }
  .modal-card h3{
    font-family:'Noto Serif Bengali',serif;
    margin:0 0 4px;
    font-size:16px;
  }
  .modal-card p.sub{margin:0 0 14px;font-size:12px;color:var(--ink-soft);}
  .modal-card input[type=text]{
    width:100%;
    padding:12px 13px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-size:14.5px;
    font-family:inherit;
    outline:none;
    margin-bottom:16px;
  }
  .modal-card input[type=text]:focus{border-color:var(--brass);}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions button{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-cancel{background:#F0EEE6;color:var(--ink);}
  .btn-confirm{background:var(--navy);color:#fff;}
  .btn-confirm.danger{background:var(--danger);}
</style>
</head>
<body>
<div id="app">
  <header id="header"></header>
  <main id="main"></main>
  <div id="toast"></div>
  <div id="modalRoot"></div>
</div>

<script>
/* ================= IndexedDB storage layer ================= */
const DB_NAME = 'identificationAppDB';
const DB_VERSION = 1;
let dbPromise = null;
let idbAvailable = true;

function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB unsupported')); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('photos')) db.createObjectStore('photos');
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error || new Error('IndexedDB open failed'));
  });
  return dbPromise;
}
async function idbPut(store, key, value){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).put(value, key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbGet(store, key){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbDelete(store, key){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbGetAllEntries(store){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const os = tx.objectStore(store);
    const keysReq = os.getAllKeys();
    const valsReq = os.getAll();
    tx.oncomplete = ()=> resolve({keys:keysReq.result, values:valsReq.result});
    tx.onerror = ()=> reject(tx.error);
  });
}

/* localStorage fallback (used only if IndexedDB truly unavailable) */
function lsKey(store,key){ return `idapp:${store}:${key}`; }
function lsPut(store,key,value){ try{ localStorage.setItem(lsKey(store,key), JSON.stringify(value)); return true; }catch(e){ return false; } }
function lsGet(store,key){ try{ const v = localStorage.getItem(lsKey(store,key)); return v?JSON.parse(v):undefined; }catch(e){ return undefined; } }
function lsDelete(store,key){ try{ localStorage.removeItem(lsKey(store,key)); }catch(e){} }

async function storagePut(store,key,value){
  if(idbAvailable){
    try{ return await idbPut(store,key,value); }
    catch(e){ console.warn('idb put failed, falling back', e); idbAvailable=false; }
  }
  return lsPut(store,key,value);
}
async function storageGet(store,key){
  if(idbAvailable){
    try{ return await idbGet(store,key); }
    catch(e){ console.warn('idb get failed, falling back', e); idbAvailable=false; }
  }
  return lsGet(store,key);
}
async function storageDelete(store,key){
  if(idbAvailable){
    try{ return await idbDelete(store,key); }
    catch(e){ console.warn('idb delete failed', e); idbAvailable=false; }
  }
  lsDelete(store,key);
}

/* ================= Categories ================= */
const DEFAULT_CATEGORIES = [
  { id:'nid', name:'ন্যাশনাল আইডি', sub:'জাতীয় পরিচয়পত্র', icon:'id' },
  { id:'job', name:'জব আইডি', sub:'অফিস পরিচয়পত্র', icon:'job' },
  { id:'dl',  name:'ড্রাইভিং লাইসেন্স', sub:'Driving Licence', icon:'dl' },
  { id:'bike',name:'বাইক রেজিস্ট্রেশন', sub:'রেজিস্ট্রেশন সার্টিফিকেট', icon:'bike' },
  { id:'atm', name:'ব্যাংক এটিএম কার্ড', sub:'ডেবিট / এটিএম কার্ড', icon:'atm' },
];
const MAX_CATEGORIES = 10;

const ICONS = {
  id:  `<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="8.5" cy="12" r="1.6"/><line x1="12.5" y1="10.2" x2="18" y2="10.2"/><line x1="12.5" y1="13.5" x2="18" y2="13.5"/>`,
  job: `<rect x="4" y="8" width="16" height="11" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="4" y1="13" x2="20" y2="13"/>`,
  dl:  `<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.6"/><line x1="12" y1="4.3" x2="12" y2="7.8"/><line x1="12" y1="16.2" x2="12" y2="19.7"/><line x1="4.3" y1="12" x2="7.8" y2="12"/><line x1="16.2" y1="12" x2="19.7" y2="12"/>`,
  bike:`<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17 10 9h5l3 5"/><path d="M10 9 8.5 6h-2"/><line x1="13" y1="9" x2="18" y2="17"/>`,
  atm: `<rect x="3" y="6" width="18" height="12" rx="2"/><line x1="3" y1="10.2" x2="21" y2="10.2"/><rect x="6" y="13.3" width="5" height="2.4" rx="0.5"/>`,
  custom:`<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 10h8"/><path d="M8 14h5"/>`,
  chevron:`<path d="M9 6l6 6-6 6"/>`,
  back:`<path d="M15 5l-7 7 7 7"/>`,
  camera:`<path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.2"/>`,
  refresh:`<path d="M4 4v5h5"/><path d="M20 20v-5h-5"/><path d="M4.6 9a8 8 0 0 1 14-3.6L20 9"/><path d="M19.4 15a8 8 0 0 1-14 3.6L4 15"/>`,
  trash:`<path d="M4 7h16"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/>`,
  pencil:`<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>`,
  plus:`<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>`,
  check:`<path d="M20 6 9 17l-5-5"/>`,
};
function svgIcon(key, extra=''){
  return `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ${extra}>${ICONS[key]||''}</svg>`;
}

let state = { view:'home', category:null, photos:{}, categories:[], editMode:false, loading:true };

const headerEl = document.getElementById('header');
const mainEl = document.getElementById('main');
const toastEl = document.getElementById('toast');
const modalRoot = document.getElementById('modalRoot');

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toastEl.classList.remove('show'), 2000);
}

function keyFor(catId, side){ return `${catId}:${side}`; }

async function loadCategories(){
  let saved = await storageGet('meta','categories');
  if(!saved || !Array.isArray(saved) || saved.length===0){
    saved = DEFAULT_CATEGORIES;
    await storagePut('meta','categories', saved);
  }
  state.categories = saved;
}
async function saveCategories(){
  await storagePut('meta','categories', state.categories);
}

async function loadPhotos(){
  try{
    if(idbAvailable){
      const { keys, values } = await idbGetAllEntries('photos');
      keys.forEach((k,i)=>{
        const [cat, side] = k.split(':');
        state.photos[cat] = state.photos[cat] || {};
        state.photos[cat][side] = values[i];
      });
    } else {
      state.categories.forEach(c=>{
        ['front','back'].forEach(side=>{
          const v = lsGet('photos', keyFor(c.id, side));
          if(v){ state.photos[c.id] = state.photos[c.id] || {}; state.photos[c.id][side] = v; }
        });
      });
    }
  }catch(e){
    console.error('loadPhotos failed', e);
  }
}

async function loadAll(){
  state.loading = true;
  render();
  try{
    await openDB();
  }catch(e){
    console.warn('IndexedDB unavailable, using localStorage fallback', e);
    idbAvailable = false;
  }
  await loadCategories();
  await loadPhotos();
  state.loading = false;
  render();
}

function statusFor(catId){
  const p = state.photos[catId] || {};
  const count = (p.front?1:0) + (p.back?1:0);
  if(count===2) return {cls:'full', text:'দুটি ছবি আপলোড হয়েছে'};
  if(count===1) return {cls:'partial', text:'১টি ছবি আপলোড হয়েছে'};
  return {cls:'empty', text:'কোনো ছবি নেই'};
}

function openCategory(id){
  if(state.editMode) return;
  state.view = 'detail';
  state.category = id;
  render();
}
function goHome(){
  state.view = 'home';
  state.category = null;
  render();
}
function toggleEditMode(){
  state.editMode = !state.editMode;
  render();
}

/* ---------- Modal ---------- */
function closeModal(){ modalRoot.innerHTML = ''; }
function openModal({title, sub, showInput, placeholder, initialValue, confirmText, danger, onConfirm}){
  modalRoot.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card">
        <h3>${title}</h3>
        ${sub? `<p class="sub">${sub}</p>`:''}
        ${showInput? `<input type="text" id="modalInput" placeholder="${placeholder||''}" value="${initialValue?initialValue.replace(/"/g,'&quot;'):''}" maxlength="30">`:''}
        <div class="modal-actions">
          <button class="btn-cancel" id="modalCancel">বাতিল</button>
          <button class="btn-confirm ${danger?'danger':''}" id="modalConfirm">${confirmText||'ঠিক আছে'}</button>
        </div>
      </div>
    </div>`;
  const overlay = document.getElementById('modalOverlay');
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  document.getElementById('modalCancel').onclick = closeModal;
  const input = document.getElementById('modalInput');
  if(input) setTimeout(()=>input.focus(), 50);
  document.getElementById('modalConfirm').onclick = ()=>{
    const val = input ? input.value.trim() : true;
    if(showInput && !val){ showToast('একটি নাম লিখুন'); return; }
    onConfirm(val);
  };
}

/* ---------- Category CRUD ---------- */
function promptAddCategory(){
  if(state.categories.length >= MAX_CATEGORIES){
    showToast(`সর্বোচ্চ ${MAX_CATEGORIES}টি মেনু যোগ করা যাবে`);
    return;
  }
  openModal({
    title:'নতুন মেনু যোগ করুন',
    sub:'যেমন: Student ID, Special ID',
    showInput:true,
    placeholder:'মেনুর নাম লিখুন',
    confirmText:'যোগ করুন',
    onConfirm: async (name)=>{
      const id = 'custom-' + Date.now();
      state.categories.push({ id, name, sub:'', icon:'custom' });
      await saveCategories();
      closeModal();
      render();
      showToast('নতুন মেনু যোগ হয়েছে');
    }
  });
}
function promptRenameCategory(catId){
  const cat = state.categories.find(c=>c.id===catId);
  if(!cat) return;
  openModal({
    title:'মেনুর নাম পরিবর্তন',
    showInput:true,
    initialValue:cat.name,
    confirmText:'সংরক্ষণ করুন',
    onConfirm: async (name)=>{
      cat.name = name;
      await saveCategories();
      closeModal();
      render();
      showToast('মেনুর নাম পরিবর্তন হয়েছে');
    }
  });
}
function promptDeleteCategory(catId){
  const cat = state.categories.find(c=>c.id===catId);
  if(!cat) return;
  openModal({
    title:'মেনু মুছে ফেলবেন?',
    sub:`"${cat.name}" মেনু এবং এর সব ছবি স্থায়ীভাবে মুছে যাবে।`,
    showInput:false,
    confirmText:'মুছে ফেলুন',
    danger:true,
    onConfirm: async ()=>{
      await storageDelete('photos', keyFor(catId,'front'));
      await storageDelete('photos', keyFor(catId,'back'));
      delete state.photos[catId];
      state.categories = state.categories.filter(c=>c.id!==catId);
      await saveCategories();
      closeModal();
      render();
      showToast('মেনু মুছে ফেলা হয়েছে');
    }
  });
}

/* ---------- File handling ---------- */
function compressAndRead(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('পড়া যায়নি'));
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1280;
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          const scale = maxDim / Math.max(w,h);
          w = Math.round(w*scale); h = Math.round(h*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => reject(new Error('ছবি লোড করা যায়নি'));
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

let fileInput = null;
let pendingTarget = null;
function ensureFileInput(){
  if(fileInput) return fileInput;
  fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/*';
  fileInput.style.display = 'none';
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if(pendingTarget && file){
      handleUpload(pendingTarget.catId, pendingTarget.side, file);
    }
    fileInput.value = '';
    pendingTarget = null;
  });
  document.body.appendChild(fileInput);
  return fileInput;
}
function triggerFilePicker(catId, side){
  pendingTarget = { catId, side };
  ensureFileInput().click();
}

async function handleUpload(catId, side, file){
  if(!file) return;
  if(!file.type || !file.type.startsWith('image/')){
    showToast('শুধু ছবি ফাইল আপলোড করুন');
    return;
  }
  let dataUrl;
  try{
    dataUrl = await compressAndRead(file);
  }catch(e){
    console.error('compress error', e);
    showToast('ছবিটি প্রসেস করা যায়নি, অন্য ছবি দিয়ে চেষ্টা করুন');
    return;
  }

  state.photos[catId] = state.photos[catId] || {};
  state.photos[catId][side] = dataUrl;
  render();

  try{
    const ok = await storagePut('photos', keyFor(catId, side), dataUrl);
    if(ok === false) throw new Error('storage put returned false');
    showToast('ছবি সংরক্ষিত হয়েছে');
  }catch(e){
    console.error('storage save failed', e);
    showToast('ছবি দেখা যাচ্ছে, তবে স্থায়ীভাবে সংরক্ষণ করা যায়নি');
  }
}
async function handleDelete(catId, side){
  try{ await storageDelete('photos', keyFor(catId, side)); }
  catch(e){ console.error('delete error', e); }
  if(state.photos[catId]) delete state.photos[catId][side];
  render();
  showToast('ছবি মুছে ফেলা হয়েছে');
}

/* ---------- Render ---------- */
function renderHeader(){
  if(state.view === 'home'){
    headerEl.innerHTML = `
      <div class="brand-row">
        <div class="brand">
          <div class="brand-mark">${svgIcon('id')}</div>
          <div>
            <h1>IDENTIFICATION</h1>
            <p>আপনার সব পরিচয়পত্রের ছবি, এক জায়গায়</p>
          </div>
        </div>
        <div class="icon-btn ${state.editMode?'active':''}" id="editToggleBtn" title="মেনু সম্পাদনা">
          ${svgIcon(state.editMode?'check':'pencil')}
        </div>
      </div>`;
    document.getElementById('editToggleBtn').onclick = toggleEditMode;
  } else {
    const cat = state.categories.find(c=>c.id===state.category);
    headerEl.innerHTML = `
      <div class="back-row">
        <div class="icon-btn" id="backBtn">${svgIcon('back')}</div>
        <div class="detail-title">
          <h2>${cat ? cat.name : ''}</h2>
          ${cat && cat.sub ? `<p>${cat.sub}</p>` : ''}
        </div>
      </div>`;
    document.getElementById('backBtn').onclick = goHome;
  }
}

function renderSideCard(catId, side, label, hint){
  const photo = (state.photos[catId] || {})[side];
  return `
    <div class="side-card">
      <h4>${label}</h4>
      <p class="hint">${hint}</p>
      <div class="drop ${photo?'has-photo':''}" data-cat="${catId}" data-side="${side}" data-action="${photo?'noop':'upload'}">
        ${photo ? `
          <img src="${photo}" alt="${label}">
          <div class="img-actions">
            <button data-action="replace" data-cat="${catId}" data-side="${side}" title="বদলান">${svgIcon('refresh')}</button>
            <button data-action="delete" data-cat="${catId}" data-side="${side}" class="danger" title="মুছুন">${svgIcon('trash')}</button>
          </div>
        ` : `
          <div class="drop-empty">
            ${svgIcon('camera')}
            <span>ছবি আপলোড করতে ট্যাপ করুন</span>
          </div>
        `}
      </div>
    </div>`;
}

function renderMain(){
  if(state.loading){
    mainEl.innerHTML = `<div class="loading-row"><span class="spinner"></span> লোড হচ্ছে...</div>`;
    return;
  }

  if(state.view === 'home'){
    const canAdd = state.categories.length < MAX_CATEGORIES;
    mainEl.innerHTML = `
      <p class="section-label">
        <span>একটি ক্যাটাগরি বাছাই করুন</span>
        <span class="menu-count">${state.categories.length}/${MAX_CATEGORIES}</span>
      </p>
      <div class="menu">
        ${state.categories.map(c=>{
          const st = statusFor(c.id);
          return `
          <div class="menu-item" data-cat="${c.id}">
            <div class="menu-icon">${svgIcon(c.icon || 'custom')}</div>
            <div class="menu-body">
              <h3>${c.name}</h3>
              <span class="status-pill"><span class="dot ${st.cls}"></span>${st.text}</span>
            </div>
            ${state.editMode ? `
              <div class="menu-edit-actions">
                <div class="mini-btn" data-edit-cat="${c.id}" title="নাম বদলান">${svgIcon('pencil')}</div>
                <div class="mini-btn danger" data-delete-cat="${c.id}" title="মুছুন">${svgIcon('trash')}</div>
              </div>
            ` : svgIcon('chevron', 'class="chevron"')}
          </div>`;
        }).join('')}
        ${state.editMode && canAdd ? `
          <div class="add-menu-btn" id="addMenuBtn">${svgIcon('plus')}<span>নতুন মেনু যোগ করুন</span></div>
        ` : ''}
      </div>`;

    mainEl.querySelectorAll('.menu-item').forEach(el=>{
      el.onclick = (e) => {
        if(e.target.closest('[data-edit-cat]') || e.target.closest('[data-delete-cat]')) return;
        openCategory(el.dataset.cat);
      };
    });
    mainEl.querySelectorAll('[data-edit-cat]').forEach(el=>{
      el.onclick = (e) => { e.stopPropagation(); promptRenameCategory(el.dataset.editCat); };
    });
    mainEl.querySelectorAll('[data-delete-cat]').forEach(el=>{
      el.onclick = (e) => { e.stopPropagation(); promptDeleteCategory(el.dataset.deleteCat); };
    });
    const addBtn = document.getElementById('addMenuBtn');
    if(addBtn) addBtn.onclick = promptAddCategory;

  } else {
    const catId = state.category;
    mainEl.innerHTML =
      renderSideCard(catId, 'front', 'সামনের অংশ (Front Side)', 'কার্ডের সামনের দিক স্পষ্টভাবে দেখা যাচ্ছে এমন ছবি দিন') +
      renderSideCard(catId, 'back', 'পেছনের অংশ (Back Side)', 'কার্ডের পেছনের দিক স্পষ্টভাবে দেখা যাচ্ছে এমন ছবি দিন');

    mainEl.querySelectorAll('[data-action="upload"]').forEach(el=>{
      el.onclick = () => triggerFilePicker(el.dataset.cat, el.dataset.side);
    });
    mainEl.querySelectorAll('[data-action="replace"]').forEach(el=>{
      el.onclick = (e) => { e.stopPropagation(); triggerFilePicker(el.dataset.cat, el.dataset.side); };
    });
    mainEl.querySelectorAll('[data-action="delete"]').forEach(el=>{
      el.onclick = (e) => { e.stopPropagation(); handleDelete(el.dataset.cat, el.dataset.side); };
    });
  }
}

function render(){
  renderHeader();
  renderMain();
}

loadAll();
</script>
